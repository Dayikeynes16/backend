name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Un push nuevo a la misma rama cancela la corrida anterior.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Mismo motor que producción y que el contenedor de Sail.
      # La base se llama "testing" porque es la que fija phpunit.xml.
      pgsql:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sail -d testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_pgsql, pgsql, mbstring, xml, bcmath, gd, zip, intl
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias de PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar el entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Algunas pruebas renderizan la vista raíz, que necesita el manifest de Vite.
      - name: Compilar assets
        run: |
          npm ci
          npm run build

      - name: Ejecutar la suite
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password
        run: php artisan test --compact

  docs:
    name: Documentación
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Enlaces rotos, rutas de archivo que ya no existen, y specs sin estado.
      - name: Verificar la documentación
        run: node scripts/check-docs.mjs

  formato:
    name: Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias de PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      # Solo avisa: no rompe la corrida por un tema de formato.
      - name: Revisar formato
        run: vendor/bin/pint --test
        continue-on-error: true
